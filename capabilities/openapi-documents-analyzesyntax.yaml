  description: 'Google Cloud Natural Language API — documents:analyzeSyntax. 1 operations. Lead operation: Google Cloud Natural
    Language Analyze syntax. Self-contained Naftiko capability covering one Google Cloud Natural Language business surface.'
  tags:
  - Google Cloud Natural Language
  - documents:analyzeSyntax
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_CLOUD_NATURAL_LANGUAGE_API_KEY: GOOGLE_CLOUD_NATURAL_LANGUAGE_API_KEY
capability:
  consumes:
  - type: http
    namespace: openapi-documents-analyzesyntax
    baseUri: https://language.googleapis.com/v1
    description: Google Cloud Natural Language API — documents:analyzeSyntax business capability. Self-contained, no shared
      references.
    resources:
    - name: documents:analyzeSyntax
      path: /documents:analyzeSyntax
      operations:
      - name: analyzesyntax
        method: POST
        description: Google Cloud Natural Language Analyze syntax
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: openapi-documents-analyzesyntax-rest
    port: 8080
    description: REST adapter for Google Cloud Natural Language API — documents:analyzeSyntax. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/documents-analyzesyntax
      name: documents-analyzesyntax
      description: REST surface for documents:analyzeSyntax.
      operations:
      - method: POST
        name: analyzesyntax
        description: Google Cloud Natural Language Analyze syntax
        call: openapi-documents-analyzesyntax.analyzesyntax
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openapi-documents-analyzesyntax-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Cloud Natural Language API — documents:analyzeSyntax. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: google-cloud-natural-language-analyze
      description: Google Cloud Natural Language Analyze syntax
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: openapi-documents-analyzesyntax.analyzesyntax
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
