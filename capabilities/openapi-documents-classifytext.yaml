naftiko: 1.0.0-alpha2
info:
  label: Google Cloud Natural Language API — documents:classifyText
  description: 'Google Cloud Natural Language API — documents:classifyText. 1 operations. Lead operation: Google Cloud Natural
    Language Classify text. Self-contained Naftiko capability covering one Google Cloud Natural Language business surface.'
  tags:
  - Google Cloud Natural Language
  - documents:classifyText
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_CLOUD_NATURAL_LANGUAGE_API_KEY: GOOGLE_CLOUD_NATURAL_LANGUAGE_API_KEY
capability:
  consumes:
  - type: http
    namespace: openapi-documents-classifytext
    baseUri: https://language.googleapis.com/v1
    description: Google Cloud Natural Language API — documents:classifyText business capability. Self-contained, no shared
      references.
    resources:
    - name: documents:classifyText
      path: /documents:classifyText
      operations:
      - name: classifytext
        method: POST
        description: Google Cloud Natural Language Classify text
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: openapi-documents-classifytext-rest
    port: 8080
    description: REST adapter for Google Cloud Natural Language API — documents:classifyText. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/documents-classifytext
      name: documents-classifytext
      description: REST surface for documents:classifyText.
      operations:
      - method: POST
        name: classifytext
        description: Google Cloud Natural Language Classify text
        call: openapi-documents-classifytext.classifytext
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openapi-documents-classifytext-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Cloud Natural Language API — documents:classifyText. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: google-cloud-natural-language-classify
      description: Google Cloud Natural Language Classify text
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: openapi-documents-classifytext.classifytext
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
