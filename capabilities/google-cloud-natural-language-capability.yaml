      path: /documents:analyzeSentiment
      operations:
      - name: analyzesentiment
        method: POST
        description: Google Cloud Natural Language Analyze sentiment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: documents-analyzeentities
