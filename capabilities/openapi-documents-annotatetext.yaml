      description: Google Cloud Natural Language Annotate text
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: openapi-documents-annotatetext.annotatetext
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
